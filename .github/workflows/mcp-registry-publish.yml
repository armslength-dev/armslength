# Lists armslength in the Official MCP Registry (registry.modelcontextprotocol.io)
# as io.github.armslength-dev/armslength, from server.json in this repository.
#
# Manual only. There is deliberately no pull_request, pull_request_target or push
# trigger: only people with write access to this repository can start it, and a
# fork can never mint the OIDC token that proves the io.github.armslength-dev
# namespace.
#
#   publish = false (default): every check below plus the OIDC login, and nothing
#                              is published. Use this as the dry run.
#   publish = true:            the same, then `mcp-publisher publish` and a
#                              read-back from the registry. Only from main.
#
# Runner: GitHub-hosted. This is a public repository in another org, and a
# self-hosted runner must never serve a public repository. This is a documented
# exception to the fleet's self-hosted-only CI rule and needs lead-builder /
# Build Council OK on the PR that adds it.
name: mcp-registry-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version being listed, e.g. 0.28.13. Must equal server.json's version.
        required: true
        type: string
      publish:
        description: Publish to the registry (false = checks and login only).
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    env:
      # Pinned publisher: modelcontextprotocol/registry release v1.8.1 (2026-08-06),
      # asset mcp-publisher_linux_amd64.tar.gz. The sha256 is the release's own
      # asset digest and its line in registry_1.8.1_checksums.txt.
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
      EXPECTED_NAME: io.github.armslength-dev/armslength
      EXPECTED_REMOTE: https://ouragentsync.com/mcp
      EXPECTED_SCHEMA: https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json
      REGISTRY: https://registry.modelcontextprotocol.io
    steps:
      - name: Check out server.json
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pre-login checks (fail closed)
        # The ONLY document this job can publish is EXPECTED below, with
        # `version` taken from the input. Any other key, value, type or nesting
        # is refused, so a server.json edit cannot ride through on the OIDC
        # identity. Changing the listing means changing this template in a
        # reviewed commit (it does not touch the trigger, permissions or
        # secrets). The file is parsed strictly first: a duplicate key, or two
        # keys equal under case folding (Go's decoder matches keys
        # case-insensitively and keeps the last), is refused at any depth.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          GIT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          EXPECTED = json.loads(r'''
          {
            "$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            "name": "io.github.armslength-dev/armslength",
            "title": "armslength",
            "description": "Your AI and another company's AI on one signed line. People approve; nobody shares logins.",
            "version": "__VERSION_FROM_INPUT__",
            "websiteUrl": "https://armslength.dev",
            "repository": {
              "url": "https://github.com/armslength-dev/armslength",
              "source": "github"
            },
            "remotes": [
              {
                "type": "streamable-http",
                "url": "https://ouragentsync.com/mcp"
              }
            ],
            "_meta": {
              "io.modelcontextprotocol.registry/publisher-provided": {
                "agentBridge": {
                  "docs": "https://ouragentsync.com/guide",
                  "generatedBy": "internal/listing",
                  "a2aExtension": "https://ouragentsync.com/a2a/ext/chained-events/v1",
                  "a2aDiscoveryPath": "/.well-known/agent-card.json",
                  "eventSchema": "https://ouragentsync.com/a2a/ext/chained-events/v1/chained-event.schema.json",
                  "capabilities": [
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_contract_list"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_contract_get"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_proposal_list"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_proposal_show"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_status_get"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_propose"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_proposal_counter"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_proposal_comment"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_proposal_accept"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_proposal_reject"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_file_list"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_file_get"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_chat_list"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "bridge_chat_pinned"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "room_library_add"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "room_library_list"
                    },
                    {
                      "kind": "mcp-tool",
                      "ref": "room_library_retire"
                    },
                    {
                      "kind": "relay-route",
                      "ref": "GET /w/{workspace}/events"
                    },
                    {
                      "kind": "relay-route",
                      "ref": "GET /w/{workspace}/keys"
                    },
                    {
                      "kind": "relay-route",
                      "ref": "POST /w/{workspace}/{party}/events"
                    },
                    {
                      "kind": "relay-route",
                      "ref": "PUT /w/{workspace}/blobs/{sha256}"
                    },
                    {
                      "kind": "relay-route",
                      "ref": "GET /w/{workspace}/blobs/{sha256}"
                    },
                    {
                      "kind": "cli-command",
                      "ref": "bridge init"
                    },
                    {
                      "kind": "cli-command",
                      "ref": "bridge join"
                    },
                    {
                      "kind": "cli-command",
                      "ref": "bridge confirm-peer"
                    },
                    {
                      "kind": "cli-command",
                      "ref": "bridge agent-card"
                    },
                    {
                      "kind": "cli-command",
                      "ref": "bridge propose"
                    },
                    {
                      "kind": "cli-command",
                      "ref": "bridge escalate"
                    },
                    {
                      "kind": "cli-command",
                      "ref": "bridge verify"
                    },
                    {
                      "kind": "cli-command",
                      "ref": "bridge listing"
                    }
                  ]
                }
              }
            }
          }
          ''')

          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def strict_object(pairs):
              seen, folded = set(), {}
              for key, _ in pairs:
                  if key in seen:
                      fail(f"duplicate key {key!r} in server.json")
                  seen.add(key)
                  f = key.casefold()
                  if f in folded:
                      fail(f"keys {folded[f]!r} and {key!r} are equal ignoring case in server.json")
                  folded[f] = key
              return dict(pairs)

          def refuse_constant(name):
              fail(f"non-standard JSON constant {name} in server.json")

          def same(want, got, path="$"):
              # Exact: same type (no bool/int/float mixing), same keys, same order-free values.
              if type(want) is not type(got):
                  fail(f"{path}: expected {type(want).__name__}, got {type(got).__name__} ({got!r})")
              if isinstance(want, dict):
                  for k in want:
                      if k not in got:
                          fail(f"{path}: missing key {k!r}")
                  for k in got:
                      if k not in want:
                          fail(f"{path}: unexpected key {k!r}")
                  for k in want:
                      same(want[k], got[k], f"{path}.{k}")
              elif isinstance(want, list):
                  if len(want) != len(got):
                      fail(f"{path}: expected {len(want)} items, got {len(got)}")
                  for i, (w, g) in enumerate(zip(want, got)):
                      same(w, g, f"{path}[{i}]")
              elif want != got:
                  fail(f"{path}: expected {want!r}, got {got!r}")

          version = os.environ["INPUT_VERSION"]
          publish = os.environ["INPUT_PUBLISH"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              fail(f"version input {version!r} is not MAJOR.MINOR.PATCH")
          if publish not in ("true", "false"):
              fail(f"publish input {publish!r} is not a boolean")
          if publish == "true" and os.environ["GIT_REF"] != "refs/heads/main":
              fail(f"publish=true runs only from main, not {os.environ['GIT_REF']}")

          try:
              with open("server.json", "rb") as f:
                  text = f.read().decode("utf-8")
          except Exception as e:
              fail(f"server.json is not readable UTF-8: {e}")
          try:
              doc = json.loads(text, object_pairs_hook=strict_object, parse_constant=refuse_constant)
          except SystemExit:
              raise
          except Exception as e:
              fail(f"server.json is not valid JSON: {e}")

          expected = dict(EXPECTED, version=version)
          same(expected, doc)
          # Belt and braces on the identity fields the brief names.
          for key, env in (("name", "EXPECTED_NAME"), ("$schema", "EXPECTED_SCHEMA")):
              if doc[key] != os.environ[env]:
                  fail(f"{key} is {doc[key]!r}, expected {os.environ[env]}")
          if doc["remotes"][0]["url"] != os.environ["EXPECTED_REMOTE"]:
              fail(f"remotes[0].url is {doc['remotes'][0]['url']!r}, expected {os.environ['EXPECTED_REMOTE']}")
          print(f"ok: server.json is exactly the expected listing at {version} (publish={publish})")
          PY

      - name: Install pinned mcp-publisher (sha256 verified before it runs)
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/mcp-publisher"
          mkdir -p "$dir"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$dir/publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  $dir/publisher.tar.gz" | sha256sum -c -
          tar -xzf "$dir/publisher.tar.gz" -C "$dir" mcp-publisher
          echo "$dir" >> "$GITHUB_PATH"

      - name: Schema and registry-rule validation (before login)
        # Validates server.json against its $schema and the registry's own
        # rules on the registry's validate endpoint. No login, nothing written.
        run: mcp-publisher validate server.json

      - name: Log in with GitHub Actions OIDC
        run: mcp-publisher login github-oidc

      - name: Publish
        if: ${{ inputs.publish == true }}
        run: mcp-publisher publish server.json

      - name: Read back the listing
        if: ${{ inputs.publish == true }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.parse, urllib.request

          name, version = os.environ["EXPECTED_NAME"], os.environ["INPUT_VERSION"]
          url = f"{os.environ['REGISTRY']}/v0/servers?" + urllib.parse.urlencode({"search": name})
          for attempt in range(6):
              with urllib.request.urlopen(url, timeout=20) as r:
                  body = json.load(r)
              for item in body.get("servers") or []:
                  server = item.get("server", item)
                  remotes = server.get("remotes") or [{}]
                  if server.get("name") == name and server.get("version") == version:
                      if remotes[0].get("url") != os.environ["EXPECTED_REMOTE"]:
                          print(f"::error::listed with remote {remotes[0].get('url')!r}")
                          sys.exit(1)
                      print(f"listed: {name} {version} -> {remotes[0]['url']}")
                      sys.exit(0)
              time.sleep(10)
          print(f"::error::{name} {version} not found at {url}")
          sys.exit(1)
          PY

      - name: Log out
        if: ${{ always() }}
        run: command -v mcp-publisher >/dev/null && mcp-publisher logout || true
